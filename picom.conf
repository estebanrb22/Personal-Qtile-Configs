#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 8;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.2;
fade-out-step = 0.15;
fade-delta = 20;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1.0;

#################################
#           Corners             #
#################################

# Bordes redondeados activados por defecto
corner-radius = 12

#################################
#            Blur               #
#################################

blur-method = "dual_kawase";
blur-strength = 2
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true;
glx-no-rebind-pbo = true;
dithered-present = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# Reglas por ventana
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
  corner-radius = 0;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  match = "class_g = 'Mirage'";
  opacity = 0.97;
}, {
  match = "class_g = 'sioyek'";
  opacity = 0.9;
}, {
  match = "class_g = 'Blueman-manager'";
  opacity = 1.0;
}, {
  match = "class_g = 'code-oss'";
  opacity = 1.0;
}, {
  # Desactivar bordes redondeados en ventanas maximizadas/fullscreen
  match = "fullscreen = true";
  corner-radius = 0;
})

# Animaciones
animations = true;
animation-for-open-window = "zoom";
animation-for-unmap-window = "slide-down";
animation-for-transient-window = "slide-up";
animation-stiffness = 350.0;
animation-dampening = 25.0;
animation-window-mass = 1.0;
animation-clamping = false;